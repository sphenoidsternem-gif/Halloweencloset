<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할로윈 에로 코스튬 심리 테스트</title>
    <!-- Tailwind CSS 연동 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0510 0%, #1a0b2e 50%, #290000 100%);
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* 할로윈 분위기의 네온/글로우 효과 */
        .glow-orange {
            box-shadow: 0 0 15px rgba(255, 122, 0, 0.4);
        }
        .glow-purple {
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.6);
        }
        
        .btn-option {
            transition: all 0.3s ease;
            background: rgba(30, 20, 50, 0.7);
            border: 1px solid #4a2b75;
        }
        .btn-option:hover, .btn-option:active {
            background: rgba(74, 43, 117, 0.9);
            border-color: #ff7a00;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 122, 0, 0.3);
        }

        .btn-primary {
            background: linear-gradient(90deg, #ff7a00, #8b0000);
            transition: all 0.3s ease;
        }
        .btn-primary:hover, .btn-primary:active {
            filter: brightness(1.2);
            box-shadow: 0 0 20px rgba(255, 122, 0, 0.5);
            transform: scale(1.02);
        }

        /* 페이드 인 애니메이션 */
        .fade-in {
            animation: fadeIn 0.4s ease-in forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #app-container {
            width: 100%;
            max-w: 480px;
            padding: 1.5rem;
        }
    </style>
</head>
<body class="antialiased selection:bg-purple-500 selection:text-white">

    <div id="app-container" class="mx-auto w-full max-w-md relative z-10">
        
        <!-- 시작 화면 -->
        <div id="start-screen" class="text-center fade-in flex flex-col items-center justify-center min-h-[70vh]">
            <h1 class="text-4xl font-extrabold mb-4 glow-purple tracking-tight text-purple-300">
                할로윈<br><span class="text-orange-500 text-3xl">에로 코스튬</span><br>심리 테스트
            </h1>
            <p class="text-gray-400 mb-10 text-sm leading-relaxed">
                다가오는 할로윈 밤, 당신의 내면이 원하는<br>진짜 코스튬은 무엇일까요?<br>
                <span class="text-xs text-gray-500">(하기 싫다는 없습니다. 해야만 합니다...)</span>
            </p>
            <button onclick="startTest()" class="btn-primary glow-orange text-white font-bold py-4 px-10 rounded-full w-full max-w-[280px] text-lg">
                테스트 시작하기
            </button>
        </div>

        <!-- 질문 화면 -->
        <div id="question-screen" class="hidden fade-in flex flex-col justify-center min-h-[70vh]">
            <div class="mb-8">
                <!-- 프로그레스 바 -->
                <div class="flex justify-between text-xs text-gray-400 mb-2 font-semibold">
                    <span id="progress-text">1 / 10</span>
                </div>
                <div class="w-full bg-gray-800 rounded-full h-2">
                    <div id="progress-bar" class="bg-orange-500 h-2 rounded-full transition-all duration-300" style="width: 10%"></div>
                </div>
            </div>
            
            <h2 id="question-text" class="text-xl md:text-2xl font-semibold mb-8 text-white leading-snug break-keep">
                질문이 들어갈 자리입니다.
            </h2>

            <div class="flex flex-col gap-4">
                <button id="btn-a" onclick="selectAnswer('A')" class="btn-option text-left text-gray-200 p-5 rounded-xl font-medium text-base md:text-lg leading-relaxed shadow-lg">
                    답변 A
                </button>
                <button id="btn-b" onclick="selectAnswer('B')" class="btn-option text-left text-gray-200 p-5 rounded-xl font-medium text-base md:text-lg leading-relaxed shadow-lg">
                    답변 B
                </button>
            </div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="hidden fade-in flex flex-col items-center justify-center py-10">
            <h3 class="text-gray-400 text-sm font-bold tracking-widest mb-2">당신에게 어울리는 코스튬은</h3>
            <h1 id="result-title" class="text-4xl font-extrabold mb-6 text-orange-400 glow-purple text-center">
                코스튬 이름
            </h1>
            
            <div class="bg-gray-900 bg-opacity-60 border border-purple-900 p-6 rounded-2xl w-full text-center shadow-2xl mb-8 glow-orange">
                <p id="result-desc" class="text-gray-200 text-base md:text-lg leading-relaxed break-keep">
                    결과 설명이 들어갈 자리입니다.
                </p>
            </div>

            <button onclick="restartTest()" class="btn-primary text-white font-bold py-4 px-8 rounded-full w-full max-w-[280px]">
                다시 테스트하기
            </button>
        </div>

    </div>

    <!-- 배경 장식 (선택사항, 분위기 연출용) -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden opacity-30">
        <div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-purple-800 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-64 h-64 bg-orange-800 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
    </div>

    <script>
        // --- 1. 데이터 정의 (질문 및 옵션) ---
        const questions = [
            { 
                q: "Q1. 할로윈 파티 의상을 고를 때, 당신이 더 듣고 싶은 반응은?", 
                a: { text: "\"뭐 이런생각을 했냐, 웃기다, 어이없다, 귀엽다\" 무수한 칭찬과 붐따", type: 'C' }, 
                b: { text: "\"제대로 준비했네…… \" 감탄과 미적인 감상", type: 'S' } 
            },
            { 
                q: "Q2. 코스튬의 핏을 결정할 때 더 선호하는 스타일은?", 
                a: { text: "조금 유치하고 코믹한 쪽이 좋다.", type: 'C' }, 
                b: { text: "간지나고 매력적으로 보이는 게 좋다.", type: 'S' } 
            },
            { 
                q: "Q3. 이벤트용 소품을 하나 챙긴다면?", 
                a: { text: "장난치기 좋은 뿅망치나 장난감 호박 바구니", type: 'C' }, 
                b: { text: "분위기를 잡을 수 있는 초커, 가터벨트, 혹은 채찍", type: 'S' } 
            },
            { 
                q: "Q4. 마음에 드는 상대를 유혹할 때 어느 쪽?", 
                a: { text: "예쁘게 차려입고 상대의 반응을 기다린다.", type: 'U' }, 
                b: { text: "나다. 얌전히 얼굴 붉히면서 누워라.", type: 'E' } 
            },
            { 
                q: "Q5. 어느 쪽이 섹시하다고 생각해?", 
                a: { text: "양말과 하의 사이의 발목, 푼 단추 사이의 쇄골, 꽉 조인 실루엣", type: 'U' }, 
                b: { text: "시원하게 면적이 적은 숏팬츠/언더붑/상의탈의", type: 'E' } 
            },
            { 
                q: "Q6. 만난 후에 이런 분위기면 좋겠어~", 
                a: { text: "간질간질 긴가민가 애타면서 은근한 분위기", type: 'U' }, 
                b: { text: "낙장불입! 폭룡적 섹시코스튬 난입 사건", type: 'E' } 
            },
            { 
                q: "Q7. 본격적으로 놀게 되면 나는……", 
                a: { text: "능동적으로 분위기를 조성하며 상대를 몰아가는 타입", type: 'A' }, 
                b: { text: "상대의 반응을 유도하고 그것을 받아주는 타입", type: 'P' } 
            },
            { 
                q: "Q8. 더 해보고 싶은 건……", 
                a: { text: "상대를 내 마음대로 휘두르며 괴롭히는 역할", type: 'A' }, 
                b: { text: "어쩔 수 없는 상황에 처해 상대를 받아들여야 하는 역할", type: 'P' } 
            },
            { 
                q: "Q9. 보통 스킨십을 할 때……", 
                a: { text: "손이든 몸이든 가만있지 못하고 계속 뭘 하려든다.", type: 'A' }, 
                b: { text: "상대의 움직임을 기다리고 감내한다", type: 'P' } 
            },
            { 
                q: "Q10. 당신이 생각하는 완벽한 할로윈 밤의 마무리는?", 
                a: { text: "어질어질 울렁울렁 빙글빙글", type: 'F' }, 
                b: { text: "쇠비린내와 내장 파티", type: 'R' } 
            }
        ];

        // --- 2. 결과 데이터 매핑 ---
        const resultData = {
            "유령": {
                name: "유령 👻",
                desc: "가타부타 준비할 여유가 없는 사람에게 적합한 코스튬. 오직 시트 한 장으로 가성비 할로윈을 즐겨봅시다. 비치는 재질로 애를 태울지, 비치지 않는 재질로 깜작 놀래킬지는 본인의 마음!"
            },
            "가면살인마": {
                name: "가면살인마 🔪",
                desc: "할로윈 거리를 나가면 한 번쯤은 나오는 정석 코스튬. 사진에도 파티에도 진짜 뒷처리에도 유용합니다. 단 위생을 위해 분장은 닦고 시간을 보냅시다."
            },
            "소악마": {
                name: "소악마 😈",
                desc: "\"사탕받고 괴롭히기도 할 거야!\" 유치함부터 노골적인 섹시함까지 다양하게 소화 가능한 코스튬. 사탕을 빌미로 상대를 잔뜩 괴롭힐 분에게 추천드립니다."
            },
            "미라": {
                name: "미라 🤕",
                desc: "허술한 듯 노골적인 드레싱 코스튬. 타이트함과 길이 조절로 수위도 텐션도 조절해봅시다. 발이 꼬이거나 천을 잡혀 묶이는 걸 주의하세요."
            },
            "뱀파이어": {
                name: "뱀파이어 🧛‍♀️",
                desc: "고딕 & 클래식으로 정제된 섹시함의 정수. 상대를 아찔하게 위협하고 깨물어봅시다. 과다출혈을 조심하세요."
            },
            "유령신부": {
                name: "유령 신부 👰‍♀️",
                desc: " 은은하고 애절한(?) 분위기로 압도하는 코스튬. 웨딩 로망을 간접적으로 실현해봅시다. 웨딩 드레스일지 웨딩 란제리일지는 마음대로."
            },
            "강시": {
                name: "강시 🧟‍♀️",
                desc: " 치파오와 구속이 합쳐진 피학 취향 코스튬. 가장 취약한 상태로 자신을 제공해봅시다. ※ 왠만하면 합의 단어를 미리 정해두세요. "
            },
            "서큐버스": {
                name: "서큐버스 🦇",
                desc: " 더 설명할 필요가 있을까요? 준비된 승부 코스튬을 입고 쟁취하십시오. 싱싱한 (싱싱하지 않은 취향도 존중합니다) 사람은 수 없이 많습니다. "
            },
            "늑대인간": {
                name: "늑대인간 🐺",
                desc: " 인간에게는 없는 기관으로 귀여움과 야생성을 표현할 수 있는 코스튬. 짐승의 본능을 핑계로 마음껏 달려들어보세요. 개가 될지 늑대인간이 될지는 당신에게 달렸습니다."
            }
        };

        // --- 3. 상태 변수 ---
        let currentQuestionIndex = 0;
        let scores = { C: 0, S: 0, U: 0, E: 0, A: 0, P: 0, F: 0, R: 0 };

        // DOM 요소
        const screenStart = document.getElementById('start-screen');
        const screenQuestion = document.getElementById('question-screen');
        const screenResult = document.getElementById('result-screen');
        const questionText = document.getElementById('question-text');
        const btnA = document.getElementById('btn-a');
        const btnB = document.getElementById('btn-b');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        // --- 4. 함수 정의 ---
        function startTest() {
            currentQuestionIndex = 0;
            scores = { C: 0, S: 0, U: 0, E: 0, A: 0, P: 0, F: 0, R: 0 };
            
            screenStart.classList.add('hidden');
            screenResult.classList.add('hidden');
            screenQuestion.classList.remove('hidden');
            
            renderQuestion();
        }

        function renderQuestion() {
            // 애니메이션 재설정을 위한 트릭
            screenQuestion.classList.remove('fade-in');
            void screenQuestion.offsetWidth; 
            screenQuestion.classList.add('fade-in');

            const currentQ = questions[currentQuestionIndex];
            questionText.innerText = currentQ.q;
            
            // 버튼에 타입 정보와 텍스트 연결
            btnA.innerText = currentQ.a.text;
            btnA.dataset.type = currentQ.a.type;
            
            btnB.innerText = currentQ.b.text;
            btnB.dataset.type = currentQ.b.type;

            // 프로그레스 바 업데이트
            const progressPercent = ((currentQuestionIndex + 1) / questions.length) * 100;
            progressBar.style.width = progressPercent + "%";
            progressText.innerText = `${currentQuestionIndex + 1} / ${questions.length}`;
        }

        function selectAnswer(choice) {
            const selectedType = choice === 'A' ? btnA.dataset.type : btnB.dataset.type;
            scores[selectedType]++;

            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                renderQuestion();
            } else {
                calculateResult();
            }
        }

        function calculateResult() {
            // 축별 최종 성향 계산
            const axis1 = scores.C > scores.S ? 'C' : 'S';
            const axis2 = scores.U > scores.E ? 'U' : 'E';
            const axis3 = scores.A > scores.P ? 'A' : 'P';
            const axis4 = scores.F > scores.R ? 'F' : 'R';

            const combo = axis1 + axis2 + axis3 + axis4;
            let finalCostume = "";

            // 매핑 로직 (요청하신 분기 완벽 적용 + 안전한 Fallback)
            if (axis1 === 'C' && axis2 === 'U' && axis3 === 'A' && axis4 === 'F') finalCostume = "유령";
            else if (axis1 === 'C' && axis2 === 'U' && axis3 === 'A' && axis4 === 'R') finalCostume = "가면살인마";
            else if (axis1 === 'C' && axis2 === 'U' && axis3 === 'P') finalCostume = "유령"; // fallback
            
            else if (axis1 === 'C' && axis2 === 'E' && axis3 === 'A') finalCostume = "소악마"; // F/R 무관
            else if (axis1 === 'C' && axis2 === 'E' && axis3 === 'P') finalCostume = "미라"; // F/R 무관
            
            else if (axis1 === 'S' && axis2 === 'U' && axis3 === 'A') finalCostume = "뱀파이어"; // F/R 무관
            else if (axis1 === 'S' && axis2 === 'U' && axis3 === 'P' && axis4 === 'F') finalCostume = "유령신부";
            else if (axis1 === 'S' && axis2 === 'U' && axis3 === 'P' && axis4 === 'R') finalCostume = "강시";
            
            else if (axis1 === 'S' && axis2 === 'E' && axis3 === 'A' && axis4 === 'F') finalCostume = "서큐버스";
            else if (axis1 === 'S' && axis2 === 'E' && axis3 === 'A' && axis4 === 'R') finalCostume = "늑대인간";
            else if (axis1 === 'S' && axis2 === 'E' && axis3 === 'P') finalCostume = "강시"; // fallback
            
            else finalCostume = "유령"; // 혹시 모를 에러 방지 기본값

            showResult(finalCostume);
        }

        function showResult(costumeKey) {
            screenQuestion.classList.add('hidden');
            screenResult.classList.remove('hidden');

            const result = resultData[costumeKey];
            document.getElementById('result-title').innerText = result.name;
            document.getElementById('result-desc').innerText = result.desc;
        }

        function restartTest() {
            screenResult.classList.add('hidden');
            startTest();
        }
    </script>
</body>
</html>
